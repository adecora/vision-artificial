project:
  type: book
  output-dir: docs
  preview:
    port: 4400
    browser: true

lang: es

book:
  title: "MIIA: Visión Artificial, PEC 1"
  output-file: MIIA_Visión_Artificial_PEC_1
  favicon: assets/favicon.ico
  author: "Alejandro de Cora"
  date: today
  downloads: [pdf]
  chapters:
    - index.md
    - 01-playground-pipeline.ipynb
    - 02-transformaciones.ipynb
    - 03-calibracion.ipynb
    - 04-tracking.ipynb
    - 05-segmentacion.ipynb
    - references.qmd

bibliography: references.bib
csl: https://www.zotero.org/styles/ieee-access

execute:
  warning: false
  message: false

format:
  html:
    theme:
      light: [pandoc]
      dark: [darkly]
    # other-links:
    #   - text: NASA Open Data
    #     href: https://data.nasa.gov/
    # code-links:
    #   - text: Data Import Code
    #     icon: file-code
    #     href: data-import.py
    toc: true
    toc-depth: 3
    code-fold: false
    code-tools: false
    number-sections: true
  pdf:
    documentclass: scrreprt
    titlepage: true
    toc: true
    number-sections: true
    colorlinks: true
    papersize: a4
    geometry:
      - margin=2.5cm
    include-in-header:
      text: |
        \usepackage{needspace}
        \usepackage{graphicx}
        % Logo de la UNED en la portada
        \titlehead{%
          \centering
          \includegraphics[width=0.22\textwidth]{assets/logo-uned.jpg}
          \par\vspace{2cm}
        }
        % Alinear arriba las figuras en páginas de flotantes
        \makeatletter
        \setlength{\@fptop}{0pt}
        \makeatother
        \usepackage{fvextra}
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,commandchars=\\\{\}}
